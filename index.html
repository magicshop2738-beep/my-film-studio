
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Film Studio</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div>
          <h1>MY AI FILM STUDIO</h1>
          <p>Your creative universe</p>
        </div>
      </div>

      <div class="project-panel">
        <label for="projectSelect">CURRENT PROJECT</label>
        <select id="projectSelect"></select>
        <button id="newProjectBtn" class="secondary-btn">+ New project</button>
      </div>

      <nav class="navigation">
        <button class="nav-link active" data-page="dashboard">⌂ Dashboard</button>
        <button class="nav-link" data-page="image">▧ Image Studio</button>
        <button class="nav-link" data-page="video">▶ Video Studio</button>
        <button class="nav-link" data-page="voice">♫ Voice Studio</button>
        <button class="nav-link" data-page="characters">♙ Character Studio</button>
        <button class="nav-link" data-page="library">▤ Element Library</button>
        <button class="nav-link" data-page="editor">✂ Editing Center</button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        Local studio
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">YOUR CREATIVE WORKSPACE</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <span class="studio-label">MY AI FILM STUDIO</span>
        </div>
      </header>

      <section id="appContent" class="page-content">
        <div class="loading">Loading your studio...</div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <!-- AI connection -->
  <script src="https://js.puter.com/v2/"></script>
  <script src="/frontend/app.js"></script>
</body>
</html>
